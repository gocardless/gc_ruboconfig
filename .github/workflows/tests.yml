name: tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        ruby-version: ["3.2", "3.3", "3.4", "3.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: "${{ matrix.ruby-version }}"
      - name: Validate config
        run: |-
          bundle exec ruby validate_config.rb
